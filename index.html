<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Prompt RPS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Inter", sans-serif;
            background: url('bg.png');
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .wrap {
            max-width: 840px;
            margin: 0 auto;
        }

        .card {
            background: #fff;
            border: 4px solid #000;
            box-shadow: 8px 8px 0 #000;
            padding: 2rem;
            margin-bottom: 1.5rem;
        }

        .card-yellow { background: #FFE600; }
        .card-pink   { background: #FF6B9D; }
        .card-cyan   { background: #00D4FF; }
        .card-purple { background: #B366FF; }
        .card-orange { background: #FF8C42; }
        .card-lime   { background: #B5FF7A; }
        .card-white  { background: #fff; }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            font-size: 1rem;
            font-weight: 700;
            text-align: center;
            color: #000;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .field-group {
            border: 4px solid #000;
            padding: 1rem;
            margin-bottom: 0.75rem;
            background: #fff;
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .field-group label {
            display: block;
            font-weight: 800;
            font-size: 1rem;
            margin-bottom: 0.25rem;
            width: 100%;
        }

        input[type="text"],
        input[type="number"] {
            border: 4px solid #000;
            padding: 0.75rem;
            font-family: "Inter", sans-serif;
            font-weight: 700;
            font-size: 0.875rem;
            background: #fff;
            outline: none;
            flex: 1;
            min-width: 120px;
        }
        input:focus {
            background: #FFE600;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 4px solid #000;
            padding: 0.75rem 1rem;
            background: #fff;
        }
        .checkbox-item label {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
        }
        .checkbox-item input[type="checkbox"] {
            width: 1.5rem;
            height: 1.5rem;
            accent-color: #000;
            cursor: pointer;
        }
        .checkbox-item .percentage-input {
            width: 80px;
            text-align: right;
            -moz-appearance: textfield;
        }
        .checkbox-item .percentage-input::-webkit-outer-spin-button,
        .checkbox-item .percentage-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        textarea {
            width: 100%;
            height: 200px;
            border: 4px solid #000;
            padding: 1rem;
            font-family: "Inter", sans-serif;
            font-weight: 700;
            font-size: 0.875rem;
            resize: vertical;
            background: #fff;
            outline: none;
        }
        textarea:focus {
            background: #FFE600;
        }

        .btn {
            border: 4px solid #000;
            padding: 0.75rem 1.5rem;
            font-family: "Inter", sans-serif;
            font-weight: 800;
            font-size: 0.875rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            transition: none;
        }
        .btn-yellow {
            background: #FFE600;
            box-shadow: 4px 4px 0 #000;
            color: #000;
        }
        .btn-yellow:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #000;
        }
        .btn-pink {
            background: #FF6B9D;
            box-shadow: 4px 4px 0 #000;
            color: #000;
        }
        .btn-pink:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #000;
        }
        .btn-orange {
            background: #FF8C42;
            box-shadow: 4px 4px 0 #000;
            color: #000;
        }
        .btn-orange:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #000;
        }
        .btn-white {
            background: #fff;
            box-shadow: 4px 4px 0 #000;
            color: #000;
        }
        .btn-white:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #000;
        }

        .btn-generate {
            border: 4px solid #000;
            padding: 1rem 3rem;
            font-family: "Inter", sans-serif;
            font-weight: 900;
            font-size: 1.25rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: -1px;
            background: #FFE600;
            box-shadow: 8px 8px 0 #000;
            color: #000;
        }
        .btn-generate:active {
            transform: translate(4px, 4px);
            box-shadow: 4px 4px 0 #000;
        }

        .flex-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .flex-row > * { flex: 1; }
        .flex-row .btn { flex: 0 0 auto; }

        .gap-top { margin-top: 1rem; }
        .gap-bottom { margin-bottom: 1.5rem; }
        .text-center { text-align: center; }
        .flex-end { display: flex; justify-content: flex-end; }
        .hidden { display: none; }
        .w-full { width: 100%; }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            .card { padding: 1rem; }
            h1 { font-size: 1.75rem; }
            .field-group { padding: 0.75rem; }
            input[type="text"], input[type="number"] { min-width: 100%; }
            .flex-row { flex-direction: column; }
            .flex-row > * { width: 100%; }
            .btn-generate { font-size: 1rem; padding: 0.75rem 2rem; }
            .checkbox-item .percentage-input { width: 60px; }
        }
    </style>
</head>
<body>
    <div class="wrap">

        <div class="card card-yellow">
            <h1>Generator Prompt RPS</h1>
            <p class="subtitle">Isi detail di bawah untuk menghasilkan prompt RPS berbasis OBE.</p>
        </div>

        <div class="card card-cyan">
            <div class="field-group">
                <label for="mata-kuliah">1. Mata Kuliah</label>
                <input type="text" id="mata-kuliah" placeholder="Nama Mata Kuliah (contoh: Pemrograman Web)">
            </div>
        </div>

        <div class="card card-cyan">
            <div class="field-group">
                <label for="sks">2. SKS</label>
                <input type="number" id="sks" placeholder="Jumlah SKS (contoh: 3)" min="1">
            </div>
        </div>

        <div class="card card-cyan">
            <div class="field-group">
                <label for="semester">3. Semester</label>
                <input type="text" id="semester" placeholder="Semester (contoh: Ganjil 2024/2025)">
            </div>
        </div>

        <div class="card card-pink">
            <h2>4. Capaian Pembelajaran Lulusan (CPL)</h2>
            <div id="cpl-container">
                <div class="field-group flex-row">
                    <input type="text" placeholder="Kode CPL (contoh: CPL-1)">
                    <input type="text" placeholder="Keterangan CPL">
                    <button type="button" class="btn btn-orange" onclick="removeFormField(this)">Hapus</button>
                </div>
            </div>
            <button type="button" class="btn btn-yellow gap-top" onclick="addFormField('cpl-container', 'CPL')">Tambah CPL</button>
        </div>

        <div class="card card-purple">
            <h2>5. Capaian Pembelajaran Mata Kuliah (CPMK)</h2>
            <div id="cpmk-container">
                <div class="field-group flex-row">
                    <input type="text" placeholder="Kode CPMK (contoh: CPMK-1)">
                    <input type="text" placeholder="Keterangan CPMK">
                    <button type="button" class="btn btn-orange" onclick="removeFormField(this)">Hapus</button>
                </div>
            </div>
            <button type="button" class="btn btn-yellow gap-top" onclick="addFormField('cpmk-container', 'CPMK')">Tambah CPMK</button>
        </div>

        <div class="card card-pink">
            <h2>6. Sub-CPMK</h2>
            <div id="subcpmk-container">
                <div class="field-group flex-row">
                    <input type="text" placeholder="Kode Sub-CPMK (contoh: Sub-CPMK-1)">
                    <input type="text" placeholder="Keterangan Sub-CPMK">
                    <button type="button" class="btn btn-orange" onclick="removeFormField(this)">Hapus</button>
                </div>
            </div>
            <button type="button" class="btn btn-yellow gap-top" onclick="addFormField('subcpmk-container', 'Sub-CPMK')">Tambah Sub-CPMK</button>
        </div>

        <div class="card card-orange">
            <h2>7. Bahan Kajian</h2>
            <div id="bahan-kajian-container">
                <div class="field-group flex-row">
                    <input type="text" placeholder="Bahan Kajian">
                    <button type="button" class="btn btn-pink" onclick="removeFormField(this)">Hapus</button>
                </div>
            </div>
            <button type="button" class="btn btn-yellow gap-top" onclick="addBahanKajian()">Tambah Bahan Kajian</button>
        </div>

        <div class="card card-lime">
            <h2>8. Kriteria Penilaian</h2>
            <p style="font-weight:700;margin-bottom:1rem;">centang &amp; masukkan persentase bobot</p>
            <div class="checkbox-group">
                <div class="checkbox-item">
                    <label for="penilaian-aktifitas">
                        <input type="checkbox" id="penilaian-aktifitas" name="penilaian" value="Aktivitas Partisipatif" onchange="togglePercentageInput(this)">
                        <span>Aktivitas Partisipatif</span>
                    </label>
                    <input type="number" placeholder="%" min="0" max="100" class="percentage-input hidden" data-label="Aktivitas Partisipatif">
                </div>
                <div class="checkbox-item">
                    <label for="penilaian-proyek">
                        <input type="checkbox" id="penilaian-proyek" name="penilaian" value="Hasil Proyek" onchange="togglePercentageInput(this)">
                        <span>Hasil Proyek</span>
                    </label>
                    <input type="number" placeholder="%" min="0" max="100" class="percentage-input hidden" data-label="Hasil Proyek">
                </div>
                <div class="checkbox-item">
                    <label for="penilaian-kuis">
                        <input type="checkbox" id="penilaian-kuis" name="penilaian" value="Kuis" onchange="togglePercentageInput(this)">
                        <span>Kuis</span>
                    </label>
                    <input type="number" placeholder="%" min="0" max="100" class="percentage-input hidden" data-label="Kuis">
                </div>
                <div class="checkbox-item">
                    <label for="penilaian-tugas">
                        <input type="checkbox" id="penilaian-tugas" name="penilaian" value="Tugas" onchange="togglePercentageInput(this)">
                        <span>Tugas</span>
                    </label>
                    <input type="number" placeholder="%" min="0" max="100" class="percentage-input hidden" data-label="Tugas">
                </div>
                <div class="checkbox-item">
                    <label for="penilaian-uts">
                        <input type="checkbox" id="penilaian-uts" name="penilaian" value="Ujian Tengah Semester" onchange="togglePercentageInput(this)">
                        <span>Ujian Tengah Semester</span>
                    </label>
                    <input type="number" placeholder="%" min="0" max="100" class="percentage-input hidden" data-label="Ujian Tengah Semester">
                </div>
                <div class="checkbox-item">
                    <label for="penilaian-uas">
                        <input type="checkbox" id="penilaian-uas" name="penilaian" value="Ujian Akhir Semester" onchange="togglePercentageInput(this)">
                        <span>Ujian Akhir Semester</span>
                    </label>
                    <input type="number" placeholder="%" min="0" max="100" class="percentage-input hidden" data-label="Ujian Akhir Semester">
                </div>
            </div>
        </div>

        <div class="text-center gap-bottom">
            <button type="button" class="btn-generate" onclick="generatePrompt()">Buat Prompt RPS</button>
        </div>

        <div class="card card-white">
            <h2>Prompt RPS Siap Pakai</h2>
            <textarea id="generated-prompt" readonly></textarea>
            <div class="flex-end gap-top">
                <button type="button" class="btn btn-white" onclick="copyPrompt()">Salin Prompt</button>
            </div>
        </div>

    </div>

    <script>
        function addFormField(containerId, type) {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = 'field-group flex-row';

            const codeInput = document.createElement('input');
            codeInput.type = 'text';
            codeInput.placeholder = 'Kode ' + type + ' (contoh: ' + type + '-X)';

            const descInput = document.createElement('input');
            descInput.type = 'text';
            descInput.placeholder = 'Keterangan ' + type;

            const removeButton = document.createElement('button');
            removeButton.type = 'button';
            removeButton.className = 'btn btn-orange';
            removeButton.textContent = 'Hapus';
            removeButton.onclick = function() { removeFormField(this); };

            div.appendChild(codeInput);
            div.appendChild(descInput);
            div.appendChild(removeButton);
            container.appendChild(div);
        }

        function addBahanKajian() {
            const container = document.getElementById('bahan-kajian-container');
            const div = document.createElement('div');
            div.className = 'field-group flex-row';

            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = 'Bahan Kajian';

            const removeButton = document.createElement('button');
            removeButton.type = 'button';
            removeButton.className = 'btn btn-pink';
            removeButton.textContent = 'Hapus';
            removeButton.onclick = function() { removeFormField(this); };

            div.appendChild(input);
            div.appendChild(removeButton);
            container.appendChild(div);
        }

        function removeFormField(buttonElement) {
            buttonElement.closest('.field-group').remove();
        }

        function togglePercentageInput(checkbox) {
            const percentageInput = checkbox.closest('.checkbox-item').querySelector('.percentage-input');
            if (checkbox.checked) {
                percentageInput.classList.remove('hidden');
                percentageInput.value = '';
                percentageInput.focus();
            } else {
                percentageInput.classList.add('hidden');
                percentageInput.value = '';
            }
        }

        function generatePrompt() {
            let prompt = 'Saya ingin kamu bertindak sebagai seorang Dosen Pengembang RPS profesional yang membuat Rencana Pembelajaran Semester.\n\nRencana Pembelajaran Semester (RPS) berbasis OBE (Outcome-Based Education) harus mencakup beberapa unsur penting, termasuk identitas mata kuliah, deskripsi mata kuliah, bahan kajian, Pustaka Utama dan pendukung. Selain itu, buatkan dalam bentuk tabel Rencana Kegiatan Belajar Mengajar seperti dibawah ini,\n1.minggu ke\n2. Kemampuan akhir tiap tahapan belajar (sub-cmpk isinya)\n3. penilaian indicator\n4. penilaian Teknik & kriteria\n5. Bentuk Pembelajaran\n6. metode pembelajaran\n7. penugasan mahasiswa dan estimasi Waktu (opsional)\n8. Materi Pembelajaran\n9. Bobot Penilaian\n\nRPS berbasis OBE juga harus memuat pengalaman belajar mahasiswa yang berpusat pada peserta didik dan berorientasi pada hasil, serta metode pembelajaran yang beragam dan fleksibel.:\n\n';

            const mataKuliah = document.getElementById('mata-kuliah').value.trim();
            if (mataKuliah) prompt += '1. Mata Kuliah: ' + mataKuliah + '\n';

            const sks = document.getElementById('sks').value.trim();
            if (sks) prompt += '2. SKS: ' + sks + '\n';

            const semester = document.getElementById('semester').value.trim();
            if (semester) prompt += '3. Semester: ' + semester + '\n';

            const cplInputs = document.querySelectorAll('#cpl-container .field-group');
            if (cplInputs.length > 0) {
                prompt += '4. Capaian Pembelajaran Lulusan (CPL) yang dibebankan pada MK:\n';
                cplInputs.forEach(group => {
                    const code = group.children[0].value.trim();
                    const desc = group.children[1].value.trim();
                    if (code || desc) prompt += '- ' + code + (desc ? ': ' + desc : '') + '\n';
                });
                prompt += '\n';
            }

            const cpmkInputs = document.querySelectorAll('#cpmk-container .field-group');
            if (cpmkInputs.length > 0) {
                prompt += '5. Capaian Pembelajaran Mata Kuliah (CPMK):\n';
                cpmkInputs.forEach(group => {
                    const code = group.children[0].value.trim();
                    const desc = group.children[1].value.trim();
                    if (code || desc) prompt += '- ' + code + (desc ? ': ' + desc : '') + '\n';
                });
                prompt += '\n';
            }

            const subCpmkInputs = document.querySelectorAll('#subcpmk-container .field-group');
            if (subCpmkInputs.length > 0) {
                prompt += '6. Sub-CPMK:\n';
                subCpmkInputs.forEach(group => {
                    const code = group.children[0].value.trim();
                    const desc = group.children[1].value.trim();
                    if (code || desc) prompt += '- ' + code + (desc ? ': ' + desc : '') + '\n';
                });
                prompt += '\n';
            }

            const bahanKajianInputs = document.querySelectorAll('#bahan-kajian-container .field-group input[type="text"]');
            if (bahanKajianInputs.length > 0) {
                prompt += '7. Bahan Kajian:\n';
                bahanKajianInputs.forEach(input => {
                    const value = input.value.trim();
                    if (value) prompt += '- ' + value + '\n';
                });
                prompt += '\n';
            }

            const penilaianCheckboxes = document.querySelectorAll('input[name="penilaian"]');
            let penilaianItems = [];
            penilaianCheckboxes.forEach(checkbox => {
                if (checkbox.checked) {
                    const percentageInput = checkbox.closest('.checkbox-item').querySelector('.percentage-input');
                    const percentage = percentageInput.value.trim();
                    penilaianItems.push({basis: checkbox.value, bobot: percentage || ''});
                }
            });

            if (penilaianItems.length > 0) {
                prompt += '8. Kriteria Penilaian (dalam bentuk tabel evaluasi):\n\n';
                prompt += '| Basis Evaluasi | Komponen Evaluasi | Sub CPMK | Deskripsi % Indikator | Metode Penilaian | Bobot |\n';
                prompt += '|----------------|-------------------|----------|------------------------|------------------|-------|\n';
                penilaianItems.forEach(item => {
                    prompt += '| ' + item.basis + ' | (isi komponen di sini) | (Sub-CPMK terkait) | (Deskripsi indikator ' + (item.bobot || '') + '%) | (Metode, contoh: tes/tugas/observasi) | ' + (item.bobot || '') + '% |\n';
                });
                prompt += '\n';
            }

            document.getElementById('generated-prompt').value = prompt;
        }

        function copyPrompt() {
            const promptTextarea = document.getElementById('generated-prompt');
            promptTextarea.select();
            document.execCommand('copy');
            alert('Prompt berhasil disalin ke clipboard!');
        }
    </script>
</body>
</html>
